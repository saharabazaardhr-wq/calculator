<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Everyday Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Layout: one centred calculator card. Display on top, 4-column key grid, history list underneath. */
    --bg: #e8ece9;
    --panel: #f7f9f8;
    --ink: #17201d;
    --muted: #5b6963;
    --key: #ffffff;
    --op: #d6e2dd;
    --accent: #0e6e5c;
    --accent-ink: #ffffff;
    --line: #c9d4cf;
    --danger: #a63a2b;
    --screen-a: #27307a; --screen-b: #0f7a95; --screen-ink: #ffffff; --screen-muted: #c4d2f2; --screen-err: #ffb9ab;
    --fn: #dbe7fb; --fn-ink: #1c4a93;
    --opk: #d45f00; --opk-ink: #ffffff;
    --clr: #fde0db; --clr-ink: #a63a2b;
    --eq: #0d8a5f; --eq-ink: #ffffff;
    --font-display: 'DM Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
    --font-body: 'DM Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f1412;
      --panel: #19211e;
      --ink: #e7efec;
      --muted: #93a39c;
      --key: #242e2a;
      --op: #2f3c37;
      --accent: #4fd1b0;
      --accent-ink: #06231c;
      --line: #0b0f0e;
      --danger: #f08a79;
    --screen-a: #1a2255; --screen-b: #0b5568; --screen-ink: #f2f6ff; --screen-muted: #a9b9de; --screen-err: #ffb9ab;
    --fn: #243756; --fn-ink: #9cc2ff;
    --opk: #f08a2e; --opk-ink: #2a1300;
    --clr: #4a2622; --clr-ink: #ff9d8c;
    --eq: #2fcf93; --eq-ink: #04241a;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f1412;
    --panel: #19211e;
    --ink: #e7efec;
    --muted: #93a39c;
    --key: #242e2a;
    --op: #2f3c37;
    --accent: #4fd1b0;
    --accent-ink: #06231c;
    --line: #0b0f0e;
    --danger: #f08a79;
    --screen-a: #1a2255; --screen-b: #0b5568; --screen-ink: #f2f6ff; --screen-muted: #a9b9de; --screen-err: #ffb9ab;
    --fn: #243756; --fn-ink: #9cc2ff;
    --opk: #f08a2e; --opk-ink: #2a1300;
    --clr: #4a2622; --clr-ink: #ff9d8c;
    --eq: #2fcf93; --eq-ink: #04241a;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    min-height: 100%;
    margin: 0;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    display: flex;
    justify-content: center;
    align-items: flex-start;
  }
  .wrap { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 16px; }

  .calc {
    background: var(--panel);
    border-radius: 20px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    box-shadow: 0 1px 0 var(--line), 0 12px 32px -16px rgba(0, 0, 0, 0.35);
  }

  .screen { display: flex; flex-direction: column; gap: 4px; padding: 12px 14px 10px; border-radius: 14px; background: linear-gradient(135deg, var(--screen-a), var(--screen-b)); color: var(--screen-ink); }
  .screen-top { display: flex; align-items: center; gap: 8px; min-height: 32px; }
  .expr {
    flex: 1;
    min-width: 0;
    overflow-x: auto;
    white-space: nowrap;
    text-align: right;
    font-family: var(--font-display);
    font-size: 1rem;
    color: var(--screen-muted);
    scrollbar-width: none;
  }
  .expr::-webkit-scrollbar { display: none; }
  .back {
    flex: none;
    width: 40px;
    height: 32px;
    border: 0;
    border-radius: 8px;
    background: transparent;
    color: var(--screen-muted);
    font: 500 1.1rem var(--font-body);
    cursor: pointer;
  }
  .back:hover { background: rgba(255, 255, 255, 0.16); color: var(--screen-ink); }
  .result {
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 2.75rem;
    line-height: 1.15;
    text-align: right;
    overflow-x: auto;
    white-space: nowrap;
    font-variant-numeric: tabular-nums;
    scrollbar-width: none;
    min-height: 3.2rem;
    color: var(--screen-ink);
  }
  .result::-webkit-scrollbar { display: none; }
  .result.m { font-size: 2.1rem; }
  .result.s { font-size: 1.6rem; }
  .result.err { font-family: var(--font-body); font-size: 1.15rem; font-weight: 600; color: var(--screen-err); line-height: 2.6rem; }

  .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .key {
    height: 60px;
    border: 0;
    border-radius: 14px;
    background: var(--key);
    color: var(--ink);
    font: 500 1.4rem var(--font-display);
    cursor: pointer;
    box-shadow: 0 2px 0 var(--line);
    transition: transform 60ms ease, filter 120ms ease;
    -webkit-tap-highlight-color: transparent;
  }
  .key.op { background: var(--fn); color: var(--fn-ink); font-family: var(--font-body); font-weight: 600; }
  .key.arith { background: var(--opk); color: var(--opk-ink); font-family: var(--font-body); font-weight: 600; font-size: 1.6rem; box-shadow: none; }
  .key.eq { background: var(--eq); color: var(--eq-ink); font-family: var(--font-body); font-weight: 600; box-shadow: none; }
  .key.clear { background: var(--clr); color: var(--clr-ink); font-family: var(--font-body); font-weight: 600; }
  .key:hover { filter: brightness(0.97); }
  .key:active, .key.flash { transform: translateY(2px); box-shadow: none; filter: brightness(0.92); }
  .key:focus-visible, .back:focus-visible, .h-clear:focus-visible, .h-item:focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }

  .history { background: var(--panel); border-radius: 20px; padding: 16px; box-shadow: 0 1px 0 var(--line); }
  .h-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .h-head h2 { margin: 0; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--muted); }
  .h-clear { border: 0; background: transparent; color: var(--muted); font: 500 0.85rem var(--font-body); cursor: pointer; padding: 4px 8px; border-radius: 6px; }
  .h-clear:hover { background: var(--op); color: var(--ink); }
  .h-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
  .h-item {
    display: flex; flex-direction: column; align-items: flex-end; gap: 2px;
    width: 100%; border: 0; background: transparent; color: var(--ink);
    padding: 8px; border-radius: 10px; cursor: pointer; text-align: right;
  }
  .h-item:hover { background: var(--op); }
  .h-item .e { font: 400 0.85rem var(--font-display); color: var(--muted); max-width: 100%; overflow-wrap: anywhere; }
  .h-item .r { font: 500 1.1rem var(--font-display); font-variant-numeric: tabular-nums; color: var(--accent); }
  .h-empty { margin: 0; padding: 8px 0; font-size: 0.9rem; color: var(--muted); }

  .pane { display: flex; flex-direction: column; gap: 16px; }
  .pane[hidden] { display: none; }
  .tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; border-radius: 14px; background: var(--panel); box-shadow: 0 1px 0 var(--line); }
  .tab { height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--muted); font: 600 0.95rem var(--font-body); cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }
  .tab:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .card { background: var(--panel); border-radius: 20px; padding: 16px; box-shadow: 0 1px 0 var(--line); display: flex; flex-direction: column; gap: 14px; }
  .emi-label { font-size: 0.85rem; font-weight: 600; color: var(--screen-muted); }
  .emi-sub { font-size: 0.85rem; color: var(--screen-muted); text-align: right; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; font-weight: 600; color: var(--muted); }
  .field input, .field select { width: 100%; height: 48px; padding: 0 12px; border: 1px solid var(--op); border-radius: 12px; background: var(--key); color: var(--ink); font: 500 1.1rem var(--font-display); }
  .field input:focus-visible, .field select:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
  .hint { font-size: 0.85rem; color: var(--muted); margin-top: -8px; min-height: 1.2em; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .bar { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: var(--op); }
  .bar .p { background: var(--accent); }
  .bar .i { background: var(--opk); }
  .sum { display: flex; flex-direction: column; gap: 10px; }
  .sum-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 0.95rem; }
  .sum-row .k { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .sum-row .v { font: 500 1.05rem var(--font-display); font-variant-numeric: tabular-nums; }
  .sum-row.total { border-top: 1px solid var(--op); padding-top: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.p { background: var(--accent); }
  .dot.i { background: var(--opk); }
  details.sched summary { cursor: pointer; font-weight: 600; font-size: 0.95rem; }
  details.sched summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .tbl { overflow-x: auto; margin-top: 10px; }
  .tbl table { width: 100%; border-collapse: collapse; font-size: 0.85rem; font-variant-numeric: tabular-nums; }
  .tbl th, .tbl td { padding: 6px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--op); }
  .tbl th:first-child, .tbl td:first-child { text-align: left; }
  .tbl th { color: var(--muted); font-weight: 600; }

  @media (prefers-reduced-motion: reduce) { .key { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="tabs" role="tablist" aria-label="Calculator type">
    <button type="button" class="tab" role="tab" id="tab-calc" aria-selected="true" aria-controls="pane-calc">Calculator</button>
    <button type="button" class="tab" role="tab" id="tab-emi" aria-selected="false" aria-controls="pane-emi">EMI</button>
  </div>

  <div class="pane" id="pane-calc" role="tabpanel" aria-labelledby="tab-calc">
  <main class="calc" aria-label="Calculator">
    <div class="screen">
      <div class="screen-top">
        <div class="expr" id="expr" aria-hidden="true"></div>
        <button type="button" class="back" id="back" aria-label="Delete last character" data-k="back">&#9003;</button>
      </div>
      <div class="result" id="result" role="status" aria-live="polite">0</div>
    </div>
    <div class="keys" id="keys">
      <button type="button" class="key clear" data-k="C" id="k-clear" aria-label="Clear all">C</button>
      <button type="button" class="key op" data-k="(" aria-label="Open bracket">(</button>
      <button type="button" class="key op" data-k=")" aria-label="Close bracket">)</button>
      <button type="button" class="key arith" data-k="÷" aria-label="Divide">÷</button>

      <button type="button" class="key" data-k="7">7</button>
      <button type="button" class="key" data-k="8">8</button>
      <button type="button" class="key" data-k="9">9</button>
      <button type="button" class="key arith" data-k="×" aria-label="Multiply">×</button>

      <button type="button" class="key" data-k="4">4</button>
      <button type="button" class="key" data-k="5">5</button>
      <button type="button" class="key" data-k="6">6</button>
      <button type="button" class="key arith" data-k="−" aria-label="Subtract">−</button>

      <button type="button" class="key" data-k="1">1</button>
      <button type="button" class="key" data-k="2">2</button>
      <button type="button" class="key" data-k="3">3</button>
      <button type="button" class="key arith" data-k="+" aria-label="Add">+</button>

      <button type="button" class="key op" data-k="%" aria-label="Percent">%</button>
      <button type="button" class="key" data-k="0">0</button>
      <button type="button" class="key" data-k="." aria-label="Decimal point">.</button>
      <button type="button" class="key eq" data-k="=" aria-label="Equals">=</button>
    </div>
  </main>

  <section class="history" aria-labelledby="h-title">
    <div class="h-head">
      <h2 id="h-title">History</h2>
      <button type="button" class="h-clear" id="h-clear">Clear</button>
    </div>
    <ul class="h-list" id="h-list"></ul>
    <p class="h-empty" id="h-empty">Finished calculations appear here. Tap one to use its result.</p>
  </section>
  </div>

  <div class="pane" id="pane-emi" role="tabpanel" aria-labelledby="tab-emi" hidden>
    <div class="screen">
      <div class="emi-label">Monthly EMI</div>
      <div class="result" id="emi-out" role="status" aria-live="polite">₹0</div>
      <div class="emi-sub" id="emi-sub"></div>
    </div>

    <div class="card">
      <label class="field" for="emi-p">Loan amount (₹)
        <input id="emi-p" type="text" inputmode="decimal" autocomplete="off" value="500000">
      </label>
      <div class="hint" id="emi-p-hint"></div>
      <label class="field" for="emi-r">Interest rate (% per year)
        <input id="emi-r" type="text" inputmode="decimal" autocomplete="off" value="12">
      </label>
      <div class="row2">
        <label class="field" for="emi-t">Tenure
          <input id="emi-t" type="text" inputmode="decimal" autocomplete="off" value="3">
        </label>
        <label class="field" for="emi-u">Unit
          <select id="emi-u"><option value="y">Years</option><option value="m">Months</option></select>
        </label>
      </div>
    </div>

    <div id="emi-results" class="pane">
      <div class="card">
        <div class="bar" id="emi-bar" aria-hidden="true"><span class="p" id="bar-p"></span><span class="i" id="bar-i"></span></div>
        <div class="sum">
          <div class="sum-row"><span class="k"><span class="dot p"></span>Loan amount</span><span class="v" id="s-p"></span></div>
          <div class="sum-row"><span class="k"><span class="dot i"></span>Total interest</span><span class="v" id="s-i"></span></div>
          <div class="sum-row total"><span class="k">Total payment</span><span class="v" id="s-t"></span></div>
        </div>
      </div>
      <div class="card">
        <details class="sched">
          <summary>Year-wise schedule</summary>
          <div class="tbl">
            <table>
              <thead><tr><th>Year</th><th>Principal</th><th>Interest</th><th>Balance</th></tr></thead>
              <tbody id="emi-rows"></tbody>
            </table>
          </div>
        </details>
      </div>
    </div>
  </div>
</div>

<script>
// <calc>
function evaluate(src) {
  var s = src.replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-');
  var open = 0;
  for (var c = 0; c < s.length; c++) {
    if (s[c] === '(') open++;
    else if (s[c] === ')') open--;
  }
  if (open < 0) throw new Error('syntax');
  var text = s + ')'.repeat(open);
  var tok = text.match(/\d+\.?\d*|\.\d+|[-+*\/()%]/g) || [];
  if (!tok.length || tok.join('') !== text) throw new Error('syntax');
  var i = 0;
  function peek() { return tok[i]; }
  // 200 + 10% means 200 + (10% of 200), as on a shop calculator.
  function expr() {
    var v = term().v;
    while (peek() === '+' || peek() === '-') {
      var o = tok[i++];
      var t = term();
      var r = t.pct ? v * t.v : t.v;
      v = o === '+' ? v + r : v - r;
    }
    return v;
  }
  function term() {
    var f = unary(), v = f.v, single = true;
    while (peek() === '*' || peek() === '/') {
      var o = tok[i++];
      var r = unary().v;
      single = false;
      if (o === '/') {
        if (r === 0) throw new Error('div0');
        v = v / r;
      } else {
        v = v * r;
      }
    }
    return { v: v, pct: single && f.pct };
  }
  function unary() {
    if (peek() === '-') { i++; var a = unary(); return { v: -a.v, pct: a.pct }; }
    if (peek() === '+') { i++; return unary(); }
    return postfix();
  }
  function postfix() {
    var p = primary(), v = p, pct = false;
    while (peek() === '%') { i++; v = v / 100; pct = true; }
    return { v: v, pct: pct };
  }
  function primary() {
    var t = tok[i++];
    if (t === undefined) throw new Error('syntax');
    if (t === '(') {
      var v = expr();
      if (tok[i++] !== ')') throw new Error('syntax');
      return v;
    }
    if (/^[\d.]/.test(t)) return parseFloat(t);
    throw new Error('syntax');
  }
  var out = expr();
  if (i !== tok.length) throw new Error('syntax');
  if (!isFinite(out)) throw new Error('range');
  out = parseFloat(out.toPrecision(15));
  return Object.is(out, -0) ? 0 : out;
}
// </calc>

(function () {
  var MAX_LEN = 60;
  var expr = '';
  var justEval = false;
  var shownExpr = '';
  var errMsg = '';
  var lastGood = 0;
  var history = [];

  var exprEl = document.getElementById('expr');
  var resEl = document.getElementById('result');
  var listEl = document.getElementById('h-list');
  var emptyEl = document.getElementById('h-empty');

  function plain(n) { return n.toLocaleString('en-US', { useGrouping: false, maximumFractionDigits: 10 }); }
  function grouped(n) { return n.toLocaleString('en-IN', { maximumFractionDigits: 10 }); }
  function groupTyped(str) {
    var neg = str.charAt(0) === '-';
    var body = neg ? str.slice(1) : str;
    var parts = body.split('.');
    var intPart = parts[0] === '' ? '0' : Number(parts[0]).toLocaleString('en-IN', { maximumFractionDigits: 0 });
    return (neg ? '-' : '') + intPart + (parts.length > 1 ? '.' + parts[1] : '');
  }
  function pretty(s) { return s.replace(/-/g, '−'); }
  function lastCh() { return expr.charAt(expr.length - 1); }
  function isDigit(c) { return c >= '0' && c <= '9'; }
  function isOp(c) { return c === '+' || c === '−' || c === '×' || c === '÷' || c === '-'; }
  function openCount() {
    var n = 0;
    for (var i = 0; i < expr.length; i++) { if (expr[i] === '(') n++; else if (expr[i] === ')') n--; }
    return n;
  }
  function trimmedExpr() { return expr.replace(/[+−×÷\-(]+$/, ''); }

  function startFresh() { if (justEval) { expr = ''; justEval = false; shownExpr = ''; } }

  function press(k) {
    errMsg = '';
    if (isDigit(k)) {
      startFresh();
      var c = lastCh();
      if (c === ')' || c === '%') expr += '×';
      var m = expr.match(/[\d.]+$/);
      if (m && m[0] === '0' && k !== '.') expr = expr.slice(0, -1);
      if (expr.length < MAX_LEN) expr += k;
    } else if (k === '.') {
      startFresh();
      var seg = expr.match(/[\d.]+$/);
      if (seg && seg[0].indexOf('.') !== -1) return render();
      var c2 = lastCh();
      if (c2 === ')' || c2 === '%') expr += '×';
      if (!seg && expr.length < MAX_LEN) expr += '0';
      if (expr.length < MAX_LEN) expr += '.';
    } else if (k === '+' || k === '−' || k === '×' || k === '÷') {
      if (isOp(lastCh())) {
        // a new operator replaces the one just typed
        var base = expr.replace(/[+−×÷\-]+$/, '');
        if (base === '' || base.slice(-1) === '(') expr = k === '−' ? base + '−' : base;
        else expr = base + k;
      } else if (expr === '' || lastCh() === '(') {
        if (k === '−') expr += k;
      } else if (expr.length < MAX_LEN) {
        expr += k;
      }
      justEval = false;
    } else if (k === '(') {
      startFresh();
      var c3 = lastCh();
      if ((isDigit(c3) || c3 === ')' || c3 === '%' || c3 === '.') && expr.length < MAX_LEN) expr += '×';
      if (expr.length < MAX_LEN) expr += '(';
    } else if (k === ')') {
      var c4 = lastCh();
      if (openCount() > 0 && (isDigit(c4) || c4 === ')' || c4 === '%') && expr.length < MAX_LEN) expr += ')';
      justEval = false;
    } else if (k === '%') {
      var c5 = lastCh();
      if ((isDigit(c5) || c5 === ')' || c5 === '%') && expr.length < MAX_LEN) expr += '%';
      justEval = false;
    } else if (k === 'C') {
      expr = ''; justEval = false; shownExpr = ''; lastGood = 0;
    } else if (k === 'back') {
      if (justEval) { expr = ''; justEval = false; shownExpr = ''; }
      else expr = expr.slice(0, -1);
    } else if (k === '=') {
      var t = trimmedExpr();
      if (t === '' || /^-?[\d.]+$/.test(t.replace('−', '-'))) {
        // nothing to calculate yet
      } else {
        try {
          var r = evaluate(t);
          history.unshift({ e: pretty(t), r: r });
          if (history.length > 8) history.pop();
          shownExpr = pretty(t) + ' =';
          expr = plain(r);
          lastGood = r;
          justEval = true;
          renderHistory();
        } catch (e) {
          errMsg = e.message === 'div0' ? "Can't divide by zero" : 'Check the expression';
        }
      }
    }
    render();
  }

  function render() {
    exprEl.textContent = justEval ? shownExpr : (/^-?[\d.]*$/.test(expr.replace('−', '-')) ? '' : pretty(expr));
    exprEl.scrollLeft = exprEl.scrollWidth;
    var big;
    resEl.className = 'result';
    if (errMsg) {
      big = errMsg;
      resEl.className = 'result err';
    } else if (expr === '') {
      big = '0';
    } else if (/^-?[\d.]*$/.test(expr.replace('−', '-'))) {
      big = groupTyped(expr.replace('−', '-'));
    } else {
      try {
        lastGood = evaluate(trimmedExpr());
      } catch (e) { /* keep the last valid preview while the expression is unfinished */ }
      big = grouped(lastGood);
    }
    if (!errMsg) {
      if (big.length > 14) resEl.className = 'result s';
      else if (big.length > 10) resEl.className = 'result m';
    }
    resEl.textContent = big;
    resEl.scrollLeft = resEl.scrollWidth;
  }

  function renderHistory() {
    listEl.innerHTML = '';
    history.forEach(function (h) {
      var li = document.createElement('li');
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'h-item';
      var e = document.createElement('span'); e.className = 'e'; e.textContent = h.e + ' =';
      var r = document.createElement('span'); r.className = 'r'; r.textContent = grouped(h.r);
      b.appendChild(e); b.appendChild(r);
      b.addEventListener('click', function () {
        expr = plain(h.r); justEval = true; shownExpr = h.e + ' ='; errMsg = ''; lastGood = h.r;
        render();
      });
      li.appendChild(b);
      listEl.appendChild(li);
    });
    emptyEl.style.display = history.length ? 'none' : 'block';
  }

  document.querySelectorAll('[data-k]').forEach(function (b) {
    b.addEventListener('click', function () { press(b.getAttribute('data-k')); });
  });
  document.getElementById('h-clear').addEventListener('click', function () { history = []; renderHistory(); });

  var keyMap = { '*': '×', '/': '÷', '-': '−', 'x': '×', 'X': '×', 'Enter': '=', '=': '=', 'Backspace': 'back', 'Escape': 'C', 'c': 'C', 'C': 'C' };
  document.addEventListener('keydown', function (ev) {
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (document.getElementById('pane-emi').hidden === false) return;
    var tg = ev.target && ev.target.tagName;
    if (tg === 'INPUT' || tg === 'SELECT') return;
    var k = ev.key;
    if (keyMap[k]) k = keyMap[k];
    else if (!(isDigit(k) || k === '.' || k === '+' || k === '(' || k === ')' || k === '%')) return;
    ev.preventDefault();
    press(k);
    var btn = document.querySelector('[data-k="' + k + '"]');
    if (btn) { btn.classList.add('flash'); setTimeout(function () { btn.classList.remove('flash'); }, 110); }
  });

  renderHistory();
  render();
})();
</script>
<script>
// <emi>
function emiCalc(P, annualPct, n) {
  var r = annualPct / 12 / 100;
  var emi = r === 0 ? P / n : P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
  var total = emi * n, bal = P, years = [];
  for (var m = 1; m <= n; m++) {
    var yi = Math.ceil(m / 12) - 1;
    if (!years[yi]) years[yi] = { year: yi + 1, principal: 0, interest: 0, balance: 0 };
    var interest = bal * r, princ = emi - interest;
    bal = Math.max(0, bal - princ);
    years[yi].principal += princ;
    years[yi].interest += interest;
    years[yi].balance = m === n ? 0 : bal;
  }
  return { emi: emi, total: total, interest: total - P, years: years };
}
// </emi>

(function () {
  function $(id) { return document.getElementById(id); }
  function num(v) { var x = parseFloat(String(v).replace(/,/g, '')); return isNaN(x) ? NaN : x; }
  function inr(n, d) { return '₹' + n.toLocaleString('en-IN', { minimumFractionDigits: d || 0, maximumFractionDigits: d || 0 }); }
  function trim(x) { return String(parseFloat(x.toFixed(2))); }
  function words(n) {
    if (n >= 1e7) return trim(n / 1e7) + ' crore';
    if (n >= 1e5) return trim(n / 1e5) + ' lakh';
    if (n >= 1e3) return trim(n / 1e3) + ' thousand';
    return '';
  }

  function update() {
    var P = num($('emi-p').value), R = num($('emi-r').value), T = num($('emi-t').value);
    var months = $('emi-u').value === 'y' ? Math.round(T * 12) : Math.round(T);
    var out = $('emi-out'), sub = $('emi-sub');
    $('emi-p-hint').textContent = P > 0 ? inr(P) + (words(P) ? ' · ' + words(P) : '') : '';
    var ok = P > 0 && R >= 0 && R <= 100 && months >= 1 && months <= 600;
    $('emi-results').hidden = !ok;
    if (!ok) {
      out.className = 'result err';
      out.textContent = 'Check the numbers';
      sub.textContent = 'Amount above 0, rate 0 to 100%, tenure up to 50 years';
      return;
    }
    var c = emiCalc(P, R, months);
    var big = inr(c.emi, 2);
    out.className = 'result' + (big.length > 14 ? ' s' : big.length > 10 ? ' m' : '');
    out.textContent = big;
    sub.textContent = months + ' months at ' + R + '% a year';
    $('s-p').textContent = inr(P);
    $('s-i').textContent = inr(c.interest);
    $('s-t').textContent = inr(c.total);
    var pp = Math.round(P / c.total * 1000) / 10;
    $('bar-p').style.width = pp + '%';
    $('bar-i').style.width = (100 - pp) + '%';
    var body = $('emi-rows');
    body.innerHTML = '';
    c.years.forEach(function (y) {
      var tr = document.createElement('tr');
      [String(y.year), inr(y.principal), inr(y.interest), inr(y.balance)].forEach(function (t) {
        var td = document.createElement('td'); td.textContent = t; tr.appendChild(td);
      });
      body.appendChild(tr);
    });
  }
  ['emi-p', 'emi-r', 'emi-t'].forEach(function (id) { $(id).addEventListener('input', update); });
  $('emi-u').addEventListener('change', update);

  function show(which) {
    var emi = which === 'emi';
    $('pane-calc').hidden = emi;
    $('pane-emi').hidden = !emi;
    $('tab-calc').setAttribute('aria-selected', String(!emi));
    $('tab-emi').setAttribute('aria-selected', String(emi));
  }
  $('tab-calc').addEventListener('click', function () { show('calc'); });
  $('tab-emi').addEventListener('click', function () { show('emi'); });

  update();
})();
</script>
